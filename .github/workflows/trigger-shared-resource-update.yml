name: Trigger Upstream Sync to Shared-Resources

on:
  push:
    branches: [main]
    paths:
      - 'template/**'

env:
  SHARED_REPO_PAT: ${{ secrets.SHARED_REPO_PAT }}
  SHARED_REPO_NAME: "${{ github.repository_owner }}/SRR-shared-resources"

jobs:
  trigger-dispatch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[auto-sync]')"
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Need last 2 commits for diff

      - name: Fetch consumer config from shared repo
        run: |
            curl -s -H "Authorization: token ${{ env.SHARED_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/${{ env.SHARED_REPO_NAME }}/contents/consumer-config.yml" \
            -o consumer-config.yml

      - name: Determine changed folders
        id: changed-folders
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
      
          FOLDERS=""
          while IFS= read -r line; do
            SHARED_FOLDER=$(echo "$line" | cut -d' ' -f1)
            LOCAL_PATH=$(echo "$line" | cut -d' ' -f2)
      
            if echo "$CHANGED_FILES" | grep -q "^${LOCAL_PATH}/"; then
              FOLDERS="$FOLDERS $SHARED_FOLDER"
            fi
          done < <(yq e ".\"${REPO_NAME}\".folders | to_entries | .[] | .key + \" \" + .value" consumer-config.yml)
      
          FOLDERS=$(echo "$FOLDERS" | xargs)  # trim whitespace
          echo "folders=$FOLDERS" >> "$GITHUB_OUTPUT"
          echo "Changed folders: $FOLDERS"

      - name: Send repository_dispatch for each changed folder
        if: steps.changed-folders.outputs.folders != ''
        env:
          SHARED_REPO_PAT: ${{ secrets.SHARED_REPO_PAT }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n1)

          for folder in ${{ steps.changed-folders.outputs.folders }}; do
            echo "📤 Dispatching upstream sync for folder: $folder"

            curl -X POST \
              -H "Authorization: token $SHARED_REPO_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/moophat/SRR-shared-resources/dispatches \
              -d "{
                \"event_type\": \"push-upstream\",
                \"client_payload\": {
                  \"consumer\": \"template-editor\",
                  \"folder\": \"$folder\",
                  \"commit_sha\": \"$COMMIT_SHA\",
                  \"commit_message\": \"$COMMIT_MSG\"
                }
              }"

            echo "✅ Dispatch sent for $folder"
          done
